  # Google News searches: hot stories from any publisher, not only the feeds above
  - id: google-news-ai-search
    name: "Google News: AI search"
    type: google_news
    query: '"AI Overviews" OR "AI Mode" OR "generative engine optimization" OR "ChatGPT search" OR "AI search"'
    section: ai_search
    weight: 0.9
    require_keywords: true
    max_per_issue: 2
    min_coverage: 2

  - id: google-news-seo
    name: "Google News: SEO updates"
    type: google_news
    query: '"core update" OR "algorithm update" OR "Google Search Console" OR "Google Discover" OR "search rankings"'
    section: seo
    weight: 0.9
    require_keywords: true
    max_per_issue: 2
    min_coverage: 2

  - id: google-news-paid-media
    name: "Google News: paid media"
    type: google_news
    query: '"Google Ads" OR "Performance Max" OR "Meta ads" OR "Amazon Ads" OR "ChatGPT ads" OR "retail media"'
    section: paid_media
    weight: 0.9
    require_keywords: true
    max_per_issue: 2
    min_coverage: 2

  - id: google-news-ai-platforms
    name: "Google News: AI platforms"
    type: google_news
    query: 'OpenAI OR Anthropic OR "Google Gemini" OR Perplexity OR "Microsoft Copilot"'
    section: ai_platforms
    weight: 0.8
    require_keywords: true
    max_per_issue: 2
    min_coverage: 2

  - id: google-news-martech
    name: "Google News: MarTech"
    type: google_news
    query: 'martech OR "marketing automation" OR "customer data platform" OR "Google Analytics" OR "programmatic advertising"'
    section: martech_analytics
    weight: 0.8
    require_keywords: true
    max_per_issue: 2
    min_coverage: 2

  # Community
  # Reddit rate-limits separate requests for each subreddit, so they are combined into one feed.
  - id: reddit
    name: Reddit
    type: reddit
    url: https://www.reddit.com/r/SEO+bigseo+PPC+marketing/top/.rss?t=week
    section: community
    community: true
    max_per_issue: 3

  - id: hacker-news
    name: Hacker News
    type: hackernews
    min_points: 50
    section: community
    community: true
    require_keywords: true
    max_per_issue: 2

  # Quora through Google Alerts. Google Alerts has no API, so each alert is created by hand at
  # https://www.google.com/alerts (signed in as rankuno@gmail.com), with "Deliver to: RSS feed".
  # Paste each alert's RSS link as the url below and set enabled: true.
  - id: quora-ai-search
    name: "Quora: AI search"
    type: google_alerts
    url: https://www.google.com/alerts/feeds/REPLACE_WITH_FEED_LINK
    section: community
    community: true
    require_keywords: true
    max_per_issue: 2
    enabled: false

  - id: quora-seo-paid
    name: "Quora: SEO and paid media"
    type: google_alerts
    url: https://www.google.com/alerts/feeds/REPLACE_WITH_FEED_LINK
    section: community
    community: true
    require_keywords: true
    max_per_issue: 2
    enabled: false
