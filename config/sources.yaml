# News sources. Every URL below was checked live (Phase 1 on 2026-09-13, Phase 2 on 2026-09-15).
#
#   type              rss (default) = a publisher's own feed. Aggregators, which point at other
#                     publishers and show "Found via ...": reddit, techmeme, google_news,
#                     google_alerts, hackernews
#   url               feed URL (not needed for google_news or hackernews)
#   query             google_news: search query; only the last 2 days are requested
#   min_points        hackernews: only stories with at least this many points
#   section           default section when no keyword decides (ids from taxonomy.yaml)
#   weight            1.0 = normal; above 1 for official or highly reliable sources
#   require_keywords  true = only include items that match at least one taxonomy keyword
#                     (use for broad sources that also publish off-topic posts)
#   min_coverage      stories need at least this many publishers covering them, unless the
#                     publisher is in trusted_publishers (used for Google News, which also
#                     surfaces content farms)
#   community         true = discussion source; placed in "From the Community", never a top story
#   max_per_issue     overrides issue.max_per_source for this source
#   enabled           false = keep the entry but skip it

# Publishers whose stories are dropped wherever they appear: names (case-insensitive) or domains.
# Mostly press-release wires, which surface through Google News searches.
exclude_publishers:
  - EIN Presswire
  - einpresswire.com
  - PR Newswire
  - prnewswire.com
  - GlobeNewswire
  - globenewswire.com
  - Business Wire
  - businesswire.com
  - openPR
  - openpr.com
  - Newsfile
  - newsfilecorp.com

# Established publishers whose single report is enough (see min_coverage). Names as Google News
# shows them, or domains.
trusted_publishers:
  # Wires, business and general news
  - Reuters
  - Associated Press
  - AP News
  - Bloomberg
  - Bloomberg.com
  - The Wall Street Journal
  - WSJ
  - Financial Times
  - The New York Times
  - The Washington Post
  - The Guardian
  - BBC
  - CNBC
  - CNN
  - Axios
  - Semafor
  - Fortune
  - Business Insider
  - The Economist
  # Technology
  - The Verge
  - TechCrunch
  - Wired
  - WIRED
  - Ars Technica
  - Engadget
  - The Information
  - VentureBeat
  - ZDNET
  - The Register
  - 9to5Google
  - 9to5Mac
  - MacRumors
  - Android Authority
  - GeekWire
  # Search, marketing and advertising trade press
  - Search Engine Land
  - Search Engine Journal
  - Search Engine Roundtable
  - PPC Land
  - MarTech
  - Digiday
  - AdExchanger
  - Adweek
  - Ad Age
  - Marketing Dive
  - The Drum
  - Campaign
  - MediaPost
  - Social Media Today
  - Marketing Week

