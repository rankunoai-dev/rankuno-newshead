# Items whose title contains any of these are dropped.
exclude_title_keywords:
  - sponsored
  - webinar
  - hiring
  - for hire
  - giveaway
  - coupon
  - promo code
  - video recap   # weekly roundups repeat stories we already carry

# Evergreen how-to and listicle posts are useful but are not news; their score is reduced.
evergreen_title_patterns:
  - '^\s*what (is|are)\b'
  - '^\s*how to\b'
  - '^\s*\d+\s+(best|top|ways|tips|examples|tools)\b'
  - '\b\d+\s+best\b'   # "New research compares 12 best GEO agencies"
  - '\b(beginner''s guide|ultimate guide|complete guide)\b'
evergreen_multiplier: 0.6
